name: Domain Integration CI Suite

on:
  push:
    branches: [ master, main, 'feat/*' ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'vault/**'
      - 'assets/**'
      - 'src/assets/**'
      - 'examples/**'
      - '.agents/skills/**/SKILL.md'
      - '.agents/skills/**/references/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'vault/**'
      - 'assets/**'
      - 'src/assets/**'
      - 'examples/**'
      - '.agents/skills/**/SKILL.md'
      - '.agents/skills/**/references/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: neuro-copilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Run Domain Test Matrix & Security Controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Domain Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Bridge Self-Tests
        run: |
          python .agents/skills/neuro-copilot/scripts/github_bridge.py self_test

      - name: Execute Domain Unit Tests
        run: |
          python run_domain_tests.py || (echo "TEST FAILURE DETECTED, DUMPING LEDGER:" && cat tests/test_audit_ledger.json && echo "DUMPING JUNIT XML:" && cat tests/test_results.xml && exit 1)

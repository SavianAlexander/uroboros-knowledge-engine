name: Security & Static Analysis Audit

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'vault/**'
      - 'assets/**'
      - 'src/assets/**'
      - 'examples/**'
      - '.agents/skills/**/SKILL.md'
      - '.agents/skills/**/references/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'vault/**'
      - 'assets/**'
      - 'src/assets/**'
      - 'examples/**'
      - '.agents/skills/**/SKILL.md'
      - '.agents/skills/**/references/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Nightly at 04:00 UTC

jobs:
  security_audit:
    name: Static Blast Radius & Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Adversarial Security Fuzzer
        run: |
          python .agents/skills/neuro-copilot/scripts/github_bridge.py crucible

      - name: Run AST Blast Radius Diagnostic
        run: |
          python .agents/skills/neuro-copilot/scripts/github_bridge.py blast_radius --target know.py

      - name: Run Code Complexity & Bloat Scanner
        run: |
          python .agents/skills/neuro-copilot/scripts/github_bridge.py detect_bloat
          python .agents/skills/neuro-copilot/scripts/github_bridge.py darwin_optimize --target know.py

      - name: Execute Full Domain Test Matrix & Trust Controls
        run: |
          python run_domain_tests.py

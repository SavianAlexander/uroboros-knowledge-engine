# ==============================================================================
# Uroboros Knowledge Engine: Cloud-Native Microservice Architecture
# Standards: SOC 2 Type II, Network Segmentation, GPU Hardware Profiles, CIS Hardened
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Core RAG Engine & SQLite Vector Vault
  # ----------------------------------------------------------------------------
  uroboros_engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: neuroalexander-uroboros_engine:latest
    container_name: uroboros_engine
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 15s
    shm_size: '256mb'
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${ENGINE_HOST_PORT:-8000}:8000"
      - "8098:8098/udp"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./requirements.txt
    volumes:
      - uroboros_data:/app/data
      - uroboros_vault:/app/vault
      - uroboros_dumps:/app/dumps
      - uroboros_backups:/app/backups
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DB_FILE=/app/data/knowledge.db
      - LLM_API_KEY=ollama
      - OPENAI_API_BASE=http://host.docker.internal:11434/v1
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=1
      - TTS_ENGINE_URL=http://uroboros_voice:8880/v1/audio/speech
      - VOICE_ENGINE_HOST=http://host.docker.internal:8880
      - VOICE_DEFAULT_MODEL=kokoro
      - VOICE_DEFAULT_VOICE=bf_emma
      - MAX_WORKERS=1
      - PYTHONMALLOC=malloc
      - MALLOC_TRIM_THRESHOLD_=65536
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 100
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend_net
      - ai_net
      - taskmaster_bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. High-Performance React SPA & Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  uroboros_frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: neuroalexander-uroboros_frontend:latest
    container_name: uroboros_frontend
    profiles: ["ui", "frontend", "all"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      uroboros_engine:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
          pids: 50
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_net
      - backend_net

  # ----------------------------------------------------------------------------
  # 3. High-Performance Neural Voice Engine (AMD-Optimized Kokoro-82M ONNX)
  # ----------------------------------------------------------------------------
  uroboros_voice:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.1.2
    container_name: uroboros_voice
    profiles: ["voice", "all"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${VOICE_HOST_PORT:-8880}:8880"
    environment:
      - DEFAULT_VOICE=bf_emma
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 50
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai_net
      - backend_net

  # ----------------------------------------------------------------------------
  # 4. Optional Containerized Ollama Instance (NVIDIA GPU Profile)
  # ----------------------------------------------------------------------------
  ollama_nvidia:
    image: ollama/ollama:latest
    container_name: uroboros_ollama_nvidia
    profiles: ["gpu-nvidia"]
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai_net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 5. Optional Containerized Ollama Instance (AMD ROCm Profile)
  # ----------------------------------------------------------------------------
  ollama_amd:
    image: ollama/ollama:latest
    container_name: uroboros_ollama_amd
    profiles: ["gpu-amd"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - ai_net
    restart: unless-stopped

# ==============================================================================
# Persistent Volumes & Isolated Network Topologies
# ==============================================================================
volumes:
  uroboros_data:
    name: uroboros_data
  uroboros_vault:
    name: uroboros_vault
  uroboros_dumps:
    name: uroboros_dumps
  uroboros_backups:
    name: uroboros_backups
  ollama_data:
    name: ollama_data
  voice_data:
    name: uroboros_voice_data

networks:
  frontend_net:
    driver: bridge
    name: uroboros_frontend_net
  backend_net:
    driver: bridge
    name: uroboros_backend_net
  ai_net:
    driver: bridge
    name: uroboros_ai_net
  taskmaster_bridge:
    driver: bridge
    name: uroboros_taskmaster_bridge

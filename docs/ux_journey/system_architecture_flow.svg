<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .bg { fill: #121211; }
      .card { fill: #181a1e; stroke: #2d3139; stroke-width: 1.5; rx: 8; }
      .title { fill: #eae0c8; font-family: system-ui, sans-serif; font-weight: 700; font-size: 20px; }
      .subtitle { fill: #a49e8d; font-family: system-ui, sans-serif; font-size: 14px; }
      .box-title { fill: #eae0c8; font-family: system-ui, sans-serif; font-weight: 600; font-size: 14px; }
      .box-desc { fill: #a49e8d; font-family: system-ui, sans-serif; font-size: 11px; }
      .arrow { stroke: #6366f1; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .accent-box { fill: #202329; stroke: #eae0c8; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1" />
    </marker>
  </defs>
  <rect class="bg" width="900" height="500" />
  
  <!-- Header -->
  <text x="40" y="45" class="title">Uroboros Knowledge Hub — System Architecture Flow</text>
  <text x="40" y="68" class="subtitle">End-to-End Data Pipeline: Ingestion, Database Engine, Hybrid Search, Concept Graph, and Glassmorphic UI</text>

  <!-- Process Flow Nodes -->
  <!-- 1. File Watcher &amp; Ingestion -->
  <rect class="card" x="40" y="110" width="220" height="100" />
  <text x="60" y="140" class="box-title">📁 File Watcher &amp; Ingestion</text>
  <text x="60" y="165" class="box-desc">• Multi-format parser (Code, Docs, Audio)</text>
  <text x="60" y="182" class="box-desc">• Decoupled metadata extraction</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 260 160 L 320 160" class="arrow" />

  <!-- 2. SQLite WAL Storage &amp; FTS5 -->
  <rect class="card" x="330" y="110" width="230" height="100" />
  <text x="350" y="140" class="box-title">🗄️ SQLite Storage &amp; FTS5</text>
  <text x="350" y="165" class="box-desc">• Singleton DB Manager (know.py)</text>
  <text x="350" y="182" class="box-desc">• Full-Text Search (FTS5) &amp; WAL Mode</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 560 160 L 620 160" class="arrow" />

  <!-- 3. Vector Embeddings &amp; RAG -->
  <rect class="card" x="630" y="110" width="230" height="100" />
  <text x="650" y="140" class="box-title">🤖 Vector Embeddings &amp; RAG</text>
  <text x="650" y="165" class="box-desc">• Vector similarity index (FAISS/numpy)</text>
  <text x="650" y="182" class="box-desc">• Local LLM with safe fallback guards</text>

  <!-- Vertical Arrows down -->
  <path d="M 150 210 L 150 280" class="arrow" />
  <path d="M 445 210 L 445 280" class="arrow" />
  <path d="M 745 210 L 745 280" class="arrow" />

  <!-- 4. Interactive Concept Graph -->
  <rect class="card" x="40" y="290" width="220" height="100" />
  <text x="60" y="320" class="box-title">🕸️ Concept Graph (D3/Canvas)</text>
  <text x="60" y="345" class="box-desc">• 6 Categorical color clusters</text>
  <text x="60" y="362" class="box-desc">• Dynamic HTML5 Canvas rendering</text>

  <!-- 5. FastAPI REST API Layer -->
  <rect class="accent-box" x="330" y="290" width="230" height="100" />
  <text x="350" y="320" class="box-title">⚡ FastAPI Backend Engine</text>
  <text x="350" y="345" class="box-desc">• Modular route endpoints (/api/...)</text>
  <text x="350" y="362" class="box-desc">• Pydantic validation &amp; Async SSE</text>

  <!-- 6. RAG Assistant Chat Interface -->
  <rect class="card" x="630" y="290" width="230" height="100" />
  <text x="650" y="320" class="box-title">💬 RAG Chat &amp; Source Chips</text>
  <text x="650" y="345" class="box-desc">• Contextual source attribution</text>
  <text x="650" y="362" class="box-desc">• Streaming response tokens</text>

  <!-- Bottom Container: Glassmorphic UI Workspace -->
  <rect class="card" x="40" y="420" width="820" height="50" stroke="#eae0c8" stroke-opacity="0.3" />
  <text x="320" y="450" class="box-title" fill="#eae0c8">🖥️ Glassmorphic Frontend (index.html, style.css, app.js)</text>
</svg>

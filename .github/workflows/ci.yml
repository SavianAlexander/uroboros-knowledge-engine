name: CI Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Matrix Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Determine Test Execution Tier
        id: test-tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          python -c "
          import json, os, subprocess
          res = subprocess.run('python .agents/skills/neuro-copilot/scripts/github_bridge.py classify_changes', shell=True, capture_output=True, text=True)
          try:
              d = json.loads(res.stdout)
          except Exception:
              d = {'tier': 3, 'run_e2e_ui_tests': True, 'run_domain_tests': True}
          event = os.environ.get('EVENT_NAME', '')
          ref = os.environ.get('REF_NAME', '')
          is_pr = event == 'pull_request'
          is_release = ref.startswith('refs/tags/v')
          tier = 3 if (is_pr or is_release) else d.get('tier', 3)
          run_e2e = 'true' if (is_pr or is_release or d.get('run_e2e_ui_tests', False)) else 'false'
          run_domain = 'true' if (is_pr or is_release or d.get('run_domain_tests', True)) else 'false'
          print(f'Detected Tier: {tier} | Run Domain: {run_domain} | Run E2E: {run_e2e}')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'TIER={tier}\nRUN_E2E={run_e2e}\nRUN_DOMAIN={run_domain}\n')
          "

      - name: Cache Playwright Browsers
        if: env.RUN_E2E == 'true' && matrix.python-version == '3.12'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Install Playwright Browsers & OS Dependencies
        if: env.RUN_E2E == 'true' && matrix.python-version == '3.12'
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: Security & Secret Scan Gate
        run: |
          python scripts/architecture_cli.py doctor .

      - name: Tier 1: Documentation & Markdown Link Integrity
        run: |
          python .agents/skills/neuro-copilot/scripts/github_bridge.py audit_skills

      - name: Tier 2: Execute Domain Unit Tests & SOC 2 Trust Controls
        if: env.RUN_DOMAIN == 'true'
        run: |
          python run_domain_tests.py || (echo "TEST FAILURE DETECTED, DUMPING LEDGER:" && cat tests/test_audit_ledger.json && echo "DUMPING JUNIT XML:" && cat tests/test_results.xml && exit 1)

      - name: Tier 3: Run Playwright E2E UI Tests
        if: env.RUN_E2E == 'true' && matrix.python-version == '3.12'
        run: python run_e2e_ui_tests.py

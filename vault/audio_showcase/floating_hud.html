<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Holographic Voice HUD</title>
  <style>
    :root {
      --bg: rgba(7, 10, 18, 0.94);
      --card-border: rgba(56, 189, 248, 0.35);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.55);
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body {
      background: var(--bg);
      color: var(--text);
      width: 440px;
      min-height: 560px;
      margin: 20px auto;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px var(--accent-glow);
      backdrop-filter: blur(25px);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }
    .hud-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    
    /* Arc Reactor Visualizer */
    .orb-box {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
    }
    .arc-reactor {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, #0284c7 50%, transparent 80%);
      box-shadow: 0 0 45px #38bdf8, inset 0 0 25px #ffffff;
      animation: pulse-hud 2.2s infinite ease-in-out;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .arc-reactor.listening {
      background: radial-gradient(circle, #22c55e 0%, #15803d 50%, transparent 80%);
      box-shadow: 0 0 55px #22c55e, inset 0 0 30px #ffffff;
      animation: pulse-fast 1s infinite ease-in-out;
    }
    .arc-reactor.speaking {
      background: radial-gradient(circle, #a855f7 0%, #7e22ce 50%, transparent 80%);
      box-shadow: 0 0 65px #a855f7, inset 0 0 35px #ffffff;
    }
    @keyframes pulse-hud {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1.05); }
      50% { transform: scale(1.25); }
    }

    /* Live Telemetry Panel */
    .telemetry-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 0;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-val { font-size: 0.85rem; font-weight: 700; color: var(--accent); margin-top: 3px; }

    /* Dialogue Log */
    .hud-log {
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.82rem;
      min-height: 65px;
      max-height: 85px;
      overflow-y: auto;
      color: #cbd5e1;
      line-height: 1.35;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #0284c7;
      color: white;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }
    .btn-action:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="hud-top">
    <div class="hud-title">⚡ EXECUTIVE HUD</div>
    <div class="badge" id="threatBadge">G-EURJ: NOMINAL</div>
  </div>

  <div class="orb-box">
    <div class="arc-reactor" id="arcCore" onclick="toggleListening()"></div>
  </div>

  <div class="hud-log" id="hudLog">
    Channel Standby. Click Arc Reactor to speak or ingest notes.
  </div>

  <div class="telemetry-grid">
    <div class="stat-card">
      <div class="stat-label">Pilot SP</div>
      <div class="stat-val" id="spVal">74.2M Allocated</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Liquid ISK</div>
      <div class="stat-val" id="iskVal">281.8M ISK</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Ship</div>
      <div class="stat-val">Pillar of Autumn</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">RAG Engine</div>
      <div class="stat-val">5,598 Files Online</div>
    </div>
  </div>

  <button class="btn-action" id="actionBtn" onclick="toggleListening()">🎙️ Open Mic Conversation</button>

  <script>
    let isListening = false;
    let rec = null;
    let audioCtx = null;
    const orb = document.getElementById('arcCore');
    const log = document.getElementById('hudLog');
    const btn = document.getElementById('actionBtn');

    // Dynamic Telemetry Refresh
    async function refreshLiveTelemetry() {
      try {
        const radarResp = await fetch('/api/voice/radar/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ system: "G-EURJ", speak_alert: false })
        });
        if (radarResp.ok) {
          const radar = await radarResp.json();
          const badge = document.getElementById('threatBadge');
          if (badge && radar.threat_level) {
            badge.innerText = `${radar.system}: ${radar.threat_level.replace('_', ' ')}`;
            badge.style.color = radar.threat_level === 'CRITICAL_RED' ? '#ef4444' : (radar.threat_level === 'ELEVATED_AMBER' ? '#f59e0b' : '#22c55e');
          }
        }
      } catch (e) {
        console.warn("Radar polling deferred:", e);
      }

      try {
        const statsResp = await fetch('/api/stats');
        if (statsResp.ok) {
          const stats = await statsResp.json();
          const ragVal = document.getElementById('ragVal');
          if (ragVal && stats.total_files) {
            ragVal.innerText = `${stats.total_files.toLocaleString()} Files Online`;
          }
        }
      } catch (e) {
        console.warn("Stats polling deferred:", e);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshLiveTelemetry();
      setInterval(refreshLiveTelemetry, 30000);
    });

    function toggleListening() {
      if (!isListening) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          log.innerText = "Speech recognition unsupported in this browser.";
          return;
        }
        rec = new SpeechRec();
        rec.continuous = true;
        rec.interimResults = false;
        rec.lang = 'en-US';

        rec.onstart = () => {
          orb.className = 'arc-reactor listening';
          log.innerText = "🟢 Listening... Speak into headset";
          btn.innerText = "⏹️ Stop Listening";
        };

        rec.onresult = async (e) => {
          const transcript = e.results[e.results.length - 1][0].transcript.trim();
          if (transcript) {
            log.innerText = `🗣️ "${transcript}"`;
            await queryDynamicIntercom(transcript);
          }
        };

        rec.start();
        isListening = true;
      } else {
        if (rec) rec.stop();
        orb.className = 'arc-reactor';
        log.innerText = "Channel Standby.";
        btn.innerText = "🎙️ Open Mic Conversation";
        isListening = false;
      }
    }

    async function queryDynamicIntercom(promptText) {
      orb.className = 'arc-reactor speaking';
      try {
        const resp = await fetch('/api/voice/intercom/turn', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText, use_rag: true, persona: "AURA_SHIP_AI" })
        });
        const data = await resp.json();
        if (data.speech_text) {
          log.innerText = `🤖 ${data.speech_text}`;
        }
        if (data.audio_base64) {
          playWavBase64(data.audio_base64);
        }
      } catch (err) {
        log.innerText = `Intercom bridge active: ${err.message}`;
        orb.className = isListening ? 'arc-reactor listening' : 'arc-reactor';
      }
    }

    function playWavBase64(b64) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const binaryString = window.atob(b64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      audioCtx.decodeAudioData(bytes.buffer, (buffer) => {
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.onended = () => {
          orb.className = isListening ? 'arc-reactor listening' : 'arc-reactor';
        };
        source.start(0);
      });
    }
  </script>
</body>
</html>

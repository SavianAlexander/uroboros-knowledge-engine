services:
  uroboros_test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: uroboros_test_runner
    shm_size: '2gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - CI=true
      - OPENAI_API_BASE=http://host.docker.internal:11434/v1
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_API_KEY=ollama

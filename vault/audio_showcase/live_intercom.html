<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sovereign Live Voice Intercom — Full-Duplex AI</title>
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(15, 23, 42, 0.85);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, var(--bg) 85%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
      overflow-x: hidden;
    }
    .hud-header {
      text-align: center;
      max-width: 800px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
    }
    
    /* Holographic Orb Visualizer */
    .orb-container {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
    }
    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 10%, #0284c7 60%, transparent 80%);
      box-shadow: 0 0 50px #38bdf8, inset 0 0 20px #ffffff;
      animation: pulse 2.5s infinite ease-in-out;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .orb.listening {
      background: radial-gradient(circle, #22c55e 10%, #15803d 60%, transparent 80%);
      box-shadow: 0 0 60px #22c55e, inset 0 0 25px #ffffff;
      animation: pulse-fast 1s infinite ease-in-out;
    }
    .orb.speaking {
      background: radial-gradient(circle, #a855f7 10%, #7e22ce 60%, transparent 80%);
      box-shadow: 0 0 70px #a855f7, inset 0 0 30px #ffffff;
      animation: pulse-speaking 0.8s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1.05); }
      50% { transform: scale(1.22); }
    }
    @keyframes pulse-speaking {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.25); filter: brightness(1.3); }
    }

    .status-badge {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      margin-top: 10px;
    }

    /* Live Dialogue Feed */
    .dialogue-box {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      height: 220px;
      overflow-y: auto;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
      max-width: 85%;
    }
    .msg.user {
      align-self: flex-end;
      background: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .msg.ai {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
    }
    .msg .speaker-tag {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.75;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    .btn {
      padding: 12px 26px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover { background: #0369a1; }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="hud-header">
    <h1>🎙️ Executive Voice Intercom</h1>
    <p class="subtitle">Full-Duplex Bidirectional Conversational AI (Gemini Live Standard)</p>
  </div>

  <div class="orb-container">
    <div class="orb" id="voiceOrb" onclick="toggleSession()"></div>
  </div>
  <div class="status-badge" id="statusBadge">Click Orb or Press 'Start Hands-Free Session'</div>

  <div class="dialogue-box" id="dialogueBox">
    <div class="msg ai">
      <div class="speaker-tag">AURA SHIP AI</div>
      Secure voice channel ready. Click below or tap the orb to start our live conversation.
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="sessionBtn" onclick="toggleSession()">▶️ Start Hands-Free Live Session</button>
  </div>

  <script>
    let isSessionActive = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let isAISpeaking = false;

    const orb = document.getElementById('voiceOrb');
    const badge = document.getElementById('statusBadge');
    const box = document.getElementById('dialogueBox');
    const btn = document.getElementById('sessionBtn');

    // Contextual Telemetry Responses
    const KNOWLEDGE_RESPONSES = {
      status: "All systems in G-EURJ are optimal. Commander Savian Alexander is piloting the Porpoise with 74.2 million SP and 281.8 million liquid ISK.",
      wallet: "Liquid wallet balance is currently 281,849,840 ISK, with full planetary reactions and mining compression active.",
      skills: "You hold 74,225,867 allocated SP and 241,613 unallocated SP reserve, certified Master Refiner.",
      fleet: "The mining wing with Thena, Vulcastra, and Tulorn are currently positioned in G-EURJ synchronized with your Porpoise.",
      default: "Acknowledged, Commander. Standing by with active telemetry in G-EURJ."
    };

    function appendMessage(speaker, text, isUser) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'ai');
      div.innerHTML = `<div class="speaker-tag">${speaker}</div>${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        badge.innerText = "⚠️ Web Speech API not supported in this browser. Please use Chrome/Brave.";
        return null;
      }
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = false;
      rec.lang = 'en-US';

      rec.onstart = () => {
        if (!isAISpeaking) {
          orb.className = 'orb listening';
          badge.innerText = "🟢 Listening... Speak into your headset";
        }
      };

      rec.onresult = (event) => {
        const last = event.results.length - 1;
        const text = event.results[last][0].transcript.trim();
        if (text) {
          handleUserUtterance(text);
        }
      };

      rec.onerror = (e) => {
        console.error('Speech recognition error:', e);
      };

      rec.onend = () => {
        if (isSessionActive && !isAISpeaking) {
          rec.start();
        }
      };

      return rec;
    }

    function handleUserUtterance(userText) {
      appendMessage("Commander", userText, true);

      // Stop speech during response
      orb.className = 'orb speaking';
      badge.innerText = "🤖 Aura Thinking & Speaking...";
      isAISpeaking = true;

      // Determine response
      const lower = userText.toLowerCase();
      let reply = KNOWLEDGE_RESPONSES.default;
      if (lower.includes("status") || lower.includes("report") || lower.includes("how are we")) {
        reply = KNOWLEDGE_RESPONSES.status;
      } else if (lower.includes("wallet") || lower.includes("isk") || lower.includes("money") || lower.includes("balance")) {
        reply = KNOWLEDGE_RESPONSES.wallet;
      } else if (lower.includes("skill") || lower.includes("sp")) {
        reply = KNOWLEDGE_RESPONSES.skills;
      } else if (lower.includes("fleet") || lower.includes("mining") || lower.includes("covetor")) {
        reply = KNOWLEDGE_RESPONSES.fleet;
      } else if (lower.includes("hello") || lower.includes("hi") || lower.includes("greetings")) {
        reply = "Greetings Commander. Voice link is crystal clear. How can I assist your fleet today?";
      }

      appendMessage("AURA SHIP AI", reply, false);

      // Speak using SpeechSynthesis / Web Audio
      const utter = new SpeechSynthesisUtterance(reply);
      utter.rate = 1.05;
      utter.pitch = 1.0;
      
      utter.onend = () => {
        isAISpeaking = false;
        if (isSessionActive) {
          orb.className = 'orb listening';
          badge.innerText = "🟢 Listening... Speak into your headset";
          if (recognition) recognition.start();
        }
      };

      synth.speak(utter);
    }

    function toggleSession() {
      if (!isSessionActive) {
        // Start
        if (!recognition) recognition = initSpeechRecognition();
        if (recognition) {
          recognition.start();
          isSessionActive = true;
          btn.innerText = "⏹️ End Live Session";
          btn.className = "btn btn-danger";
          badge.innerText = "🟢 Session Active — Speak into your headset";
        }
      } else {
        // Stop
        isSessionActive = false;
        if (recognition) recognition.stop();
        synth.cancel();
        orb.className = 'orb';
        badge.innerText = "Channel closed. Tap orb to reconnect.";
        btn.innerText = "▶️ Start Hands-Free Live Session";
        btn.className = "btn btn-primary";
      }
    }
  </script>
</body>
</html>

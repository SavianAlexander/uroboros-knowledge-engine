name: CI Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Matrix Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Determine Test Execution Tier
        id: test_tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          python -c "import json, os, subprocess; res=subprocess.run('python .agents/skills/neuro-copilot/scripts/github_bridge.py classify_changes', shell=True, capture_output=True, text=True); d=json.loads(res.stdout) if res.returncode==0 else {}; event=os.environ.get('EVENT_NAME',''); ref=os.environ.get('REF_NAME',''); is_pr=event=='pull_request'; is_rel=ref.startswith('refs/tags/v'); tier=3 if (is_pr or is_rel) else d.get('tier',3); r_e2e='true' if (is_pr or is_rel or d.get('run_e2e_ui_tests',False)) else 'false'; r_dom='true' if (is_pr or is_rel or d.get('run_domain_tests',True)) else 'false'; print(f'Tier: {tier}, E2E: {r_e2e}, Domain: {r_dom}'); out=os.environ.get('GITHUB_OUTPUT',''); open(out,'a').write(f'tier={tier}\nrun_e2e={r_e2e}\nrun_domain={r_dom}\n') if out else None"

      - name: Cache Playwright Browsers
        if: steps.test_tier.outputs.run_e2e == 'true' && matrix.python-version == '3.12'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.test_tier.outputs.run_e2e == 'true' && matrix.python-version == '3.12'
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: Security & Secret Scan Gate
        run: |
          python scripts/architecture_cli.py doctor .

      - name: "Tier 1: Documentation & Markdown Link Integrity"
        run: |
          python .agents/skills/neuro-copilot/scripts/github_bridge.py audit_skills

      - name: "Tier 2: Execute Domain Unit Tests & SOC 2 Trust Controls"
        if: steps.test_tier.outputs.run_domain == 'true'
        run: |
          python run_domain_tests.py || (echo "TEST FAILURE DETECTED, DUMPING LEDGER:" && cat tests/test_audit_ledger.json && echo "DUMPING JUNIT XML:" && cat tests/test_results.xml && exit 1)

      - name: "Tier 3: Run Playwright E2E UI Tests"
        if: steps.test_tier.outputs.run_e2e == 'true' && matrix.python-version == '3.12'
        run: python run_e2e_ui_tests.py

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="uroborosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eae0c8" />
      <stop offset="50%" stop-color="#fcf8f2" />
      <stop offset="100%" stop-color="#a49e8d" />
    </linearGradient>
    <radialGradient id="glassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eae0c8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#121211" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="44" fill="url(#glassGlow)" />
  <!-- Glass Outer Ring -->
  <circle cx="50" cy="50" r="40" fill="rgba(234, 224, 200, 0.04)" stroke="url(#uroborosGrad)" stroke-width="2" />
  <!-- Serpent Circular Body Loop -->
  <path d="M 50 14 A 36 36 0 1 1 14 50 A 36 36 0 0 1 42 14.5" fill="none" stroke="url(#uroborosGrad)" stroke-width="5" stroke-linecap="round" />
  <!-- Serpent Head swallow tail point -->
  <path d="M 42 14.5 L 50 14 L 46 22 Z" fill="#eae0c8" />
  <!-- Serpent Eye -->
  <circle cx="45" cy="17" r="1.5" fill="#121211" />
  <!-- Inner Node Core -->
  <circle cx="50" cy="50" r="8" fill="rgba(234, 224, 200, 0.15)" stroke="#eae0c8" stroke-width="1.5" />
  <circle cx="50" cy="50" r="3" fill="#eae0c8" />
</svg>
